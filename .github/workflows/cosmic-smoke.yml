name: Cosmic UI Smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          node --check app.js
          node --check refine.js
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Locate Chrome
        run: |
          CHROME=$(which google-chrome || which chromium || which chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/portfolio.log 2>&1 &
          echo $! > /tmp/portfolio.pid
          sleep 2
      - name: Browser smoke
        run: |
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const results={passes:[],failures:[],runtimeErrors:[]};
          const pass=(name,ok,detail='')=>{
            (ok?results.passes:results.failures).push({name,detail});
            if(!ok) process.exitCode=1;
          };
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});

          const desktop=await browser.newPage({viewport:{width:1440,height:1000}});
          desktop.on('pageerror',e=>results.runtimeErrors.push('page:'+e.message));
          desktop.on('console',m=>{if(m.type()==='error' && !/favicon|font/i.test(m.text())) results.runtimeErrors.push('console:'+m.text())});
          const response=await desktop.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          pass('page HTTP 200',response?.status()===200,String(response?.status()));
          pass('no horizontal overflow',await desktop.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          pass('living cosmos canvas exists',await desktop.locator('#cosmos').count()===1);
          pass('cosmos canvas has pixels',await desktop.locator('#cosmos').evaluate(e=>e.width>300&&e.height>300));

          await desktop.locator('#portrait-stage').hover();
          await desktop.waitForTimeout(450);
          pass('portrait hover activates life',await desktop.locator('#portrait-stage').evaluate(e=>e.classList.contains('is-alive')));
          pass('hover selects gravity planet',await desktop.locator('.planet.gravity-active').count()===1);
          pass('schematic layer installed',await desktop.locator('.face-schematic').count()===1);
          pass('four portrait slices installed',await desktop.locator('.face-slice').count()===4);
          await desktop.screenshot({path:'hero-hover.png',fullPage:false});

          await desktop.locator('#theme-toggle').click();
          await desktop.waitForTimeout(250);
          pass('light cosmos toggle works',await desktop.evaluate(()=>document.documentElement.dataset.theme==='light'));
          pass('theme preference UI state updates',(await desktop.locator('#theme-toggle').getAttribute('aria-pressed'))==='true');

          const about=await desktop.locator('#identity').boundingBox();
          if(about){
            await desktop.evaluate(y=>scrollTo(0,y),about.height*.48);
            await desktop.waitForTimeout(250);
            pass('brain zoom scroll phase active',await desktop.locator('#portrait-stage').evaluate(e=>parseFloat(getComputedStyle(e).getPropertyValue('--brain-zoom'))>.8));
          }

          await desktop.locator('#roadmap').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(350);
          pass('stray roadmap panel line removed',await desktop.locator('.degree-panel').evaluate(e=>parseFloat(getComputedStyle(e).borderLeftWidth)===0));
          pass('roadmap cards have distinct shapes',await desktop.locator('.degree-line').evaluateAll(nodes=>new Set(nodes.map(n=>getComputedStyle(n).borderRadius)).size>=3));

          await desktop.locator('#contact').scrollIntoViewIfNeeded();
          await desktop.waitForTimeout(500);
          pass('contact CTA is orbital core',await desktop.locator('.contact-title').evaluate(e=>getComputedStyle(e).position==='absolute'&&getComputedStyle(e).borderRadius==='50%'));
          pass('contact nodes orbit on desktop',await desktop.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='absolute')));
          results.contactNodes=await desktop.locator('.contact-side .pill').evaluateAll(nodes=>nodes.map(n=>({text:n.innerText.replace(/\s+/g,' ').trim(),top:getComputedStyle(n).top,left:getComputedStyle(n).left,right:getComputedStyle(n).right,bottom:getComputedStyle(n).bottom,x:n.getBoundingClientRect().x,y:n.getBoundingClientRect().y})));
          await desktop.screenshot({path:'desktop-contact.png',fullPage:false});

          await desktop.evaluate(()=>scrollTo(0,0));
          const nav=desktop.locator('#nav-links a').first();
          const box=await nav.boundingBox();
          if(box){
            await desktop.mouse.move(box.x+box.width/2+70,box.y+box.height/2);
            await desktop.waitForTimeout(120);
            pass('event-horizon proximity interaction',await nav.evaluate(e=>e.classList.contains('gravity-link')));
          }

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          mobile.on('pageerror',e=>results.runtimeErrors.push('mobile:'+e.message));
          await mobile.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          pass('mobile no horizontal overflow',await mobile.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          await mobile.locator('#contact').scrollIntoViewIfNeeded();
          await mobile.waitForTimeout(350);
          pass('mobile contact collapses safely',await mobile.locator('.contact-card').evaluate(e=>getComputedStyle(e).display==='grid'));
          pass('mobile contact nodes leave absolute orbit',await mobile.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='relative')));
          await mobile.screenshot({path:'mobile-contact.png',fullPage:false});

          pass('no runtime errors',results.runtimeErrors.length===0,results.runtimeErrors.join('\n'));
          fs.writeFileSync('smoke-results.json',JSON.stringify(results,null,2));
          await browser.close();
          if(results.failures.length||results.runtimeErrors.length) process.exit(1);
          NODE
          node smoke.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-smoke-evidence
          path: |
            smoke-results.json
            hero-hover.png
            desktop-contact.png
            mobile-contact.png
