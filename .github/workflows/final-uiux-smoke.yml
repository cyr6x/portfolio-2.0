name: Final UIUX Smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          node --check app.js
          node --check refine.js
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Locate Chrome
        run: |
          CHROME=$(which google-chrome || which chromium || which chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/portfolio.log 2>&1 &
          sleep 2
      - name: Browser smoke
        run: |
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const results={passes:[],failures:[],runtimeErrors:[]};
          const check=(name,ok,detail='')=>{
            (ok?results.passes:results.failures).push({name,detail});
            if(!ok) process.exitCode=1;
          };
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});

          const boot=await browser.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
          boot.on('pageerror',e=>results.runtimeErrors.push('boot:'+e.message));
          const response=await boot.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded'});
          check('HTTP 200',response?.status()===200,String(response?.status()));
          await boot.waitForTimeout(180);
          check('black hole stage visible',await boot.locator('.root-blackhole-stage').isVisible());
          check('root access CTA visible',await boot.locator('#root-loader-skip').isVisible());
          check('black hole has event horizon core',await boot.locator('.root-blackhole-core').count()===1);
          await boot.screenshot({path:'root-blackhole.png',fullPage:false});
          await boot.waitForTimeout(1500);
          check('root access exits cleanly',await boot.evaluate(()=>document.documentElement.dataset.booted==='true'));
          check('scroll unlocks',await boot.evaluate(()=>!document.documentElement.classList.contains('root-booting')));
          await boot.close();

          const dark=await browser.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
          dark.on('pageerror',e=>results.runtimeErrors.push('dark:'+e.message));
          dark.on('console',m=>{if(m.type()==='error'&&!/favicon|font/i.test(m.text()))results.runtimeErrors.push('dark-console:'+m.text())});
          await dark.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await dark.waitForTimeout(1500);
          check('dark theme defaults from OS',await dark.evaluate(()=>document.documentElement.dataset.theme==='dark'));
          check('dark color-scheme applied',await dark.evaluate(()=>getComputedStyle(document.documentElement).colorScheme.includes('dark')));
          check('dark no horizontal overflow',await dark.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          await dark.locator('#roadmap').scrollIntoViewIfNeeded();
          await dark.waitForTimeout(250);
          await dark.screenshot({path:'dark-roadmap.png',fullPage:false});
          await dark.locator('#contact').scrollIntoViewIfNeeded();
          await dark.waitForTimeout(250);
          check('dark contact orbit intact',await dark.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='absolute')));
          await dark.screenshot({path:'dark-contact.png',fullPage:false});
          await dark.close();

          const light=await browser.newPage({viewport:{width:1440,height:1000},colorScheme:'light'});
          light.on('pageerror',e=>results.runtimeErrors.push('light:'+e.message));
          light.on('console',m=>{if(m.type()==='error'&&!/favicon|font/i.test(m.text()))results.runtimeErrors.push('light-console:'+m.text())});
          await light.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await light.waitForTimeout(1500);
          check('light theme defaults from OS',await light.evaluate(()=>document.documentElement.dataset.theme==='light'));
          check('light color-scheme applied',await light.evaluate(()=>getComputedStyle(document.documentElement).colorScheme.includes('light')));
          check('theme-color updates in light',await light.locator('meta[name="theme-color"]').getAttribute('content')==='#edf3f7');
          check('light no horizontal overflow',await light.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          check('light security core readable',await light.locator('.security-core').evaluate(e=>getComputedStyle(e).color==='rgb(23, 33, 46)'));
          await light.locator('#arsenal').scrollIntoViewIfNeeded();
          await light.waitForTimeout(250);
          await light.screenshot({path:'light-skills.png',fullPage:false});
          await light.locator('#contact').scrollIntoViewIfNeeded();
          await light.waitForTimeout(250);
          check('light contact buttons use light surface',await light.locator('.contact-side .pill').first().evaluate(e=>getComputedStyle(e).backgroundColor!=='rgba(7, 9, 12, 0.8)'));
          await light.screenshot({path:'light-contact.png',fullPage:false});

          await light.locator('#theme-toggle').click();
          await light.waitForTimeout(650);
          check('manual theme toggle persists',await light.evaluate(()=>document.documentElement.dataset.theme==='dark'&&localStorage.getItem('cosmic-theme')==='dark'));
          await light.close();

          const mobile=await browser.newPage({viewport:{width:390,height:844},colorScheme:'light'});
          mobile.on('pageerror',e=>results.runtimeErrors.push('mobile:'+e.message));
          await mobile.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await mobile.waitForTimeout(1500);
          check('mobile no horizontal overflow',await mobile.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          check('mobile root black hole sized safely',await mobile.evaluate(()=>parseFloat(getComputedStyle(document.querySelector('.root-blackhole-stage')).width)<=400));
          await mobile.locator('#contact').scrollIntoViewIfNeeded();
          await mobile.waitForTimeout(250);
          check('mobile contact remains linear',await mobile.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='relative')));
          await mobile.screenshot({path:'mobile-light-contact.png',fullPage:false});
          await mobile.close();

          check('no runtime errors',results.runtimeErrors.length===0,results.runtimeErrors.join('\n'));
          fs.writeFileSync('final-uiux-results.json',JSON.stringify(results,null,2));
          await browser.close();
          if(results.failures.length||results.runtimeErrors.length) process.exit(1);
          NODE
          node smoke.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-uiux-evidence
          path: |
            final-uiux-results.json
            root-blackhole.png
            dark-roadmap.png
            dark-contact.png
            light-skills.png
            light-contact.png
            mobile-light-contact.png
