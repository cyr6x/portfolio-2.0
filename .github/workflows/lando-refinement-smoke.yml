name: Lando Refinement Smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          node --check app.js
          node --check refine.js
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Locate Chrome
        run: |
          CHROME=$(which google-chrome || which chromium || which chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/portfolio.log 2>&1 &
          sleep 2
      - name: Browser smoke
        run: |
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const results={passes:[],failures:[],runtimeErrors:[]};
          const check=(name,ok,detail='')=>{
            (ok?results.passes:results.failures).push({name,detail});
            if(!ok) process.exitCode=1;
          };

          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('pageerror',e=>results.runtimeErrors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon|font/i.test(m.text()))results.runtimeErrors.push('console:'+m.text())});

          const response=await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded'});
          check('HTTP 200',response?.status()===200,String(response?.status()));
          check('root loader initially present',await page.locator('#root-loader').count()===1);
          await page.waitForTimeout(1450);
          check('root loader self-dismisses',await page.evaluate(()=>document.documentElement.dataset.booted==='true'));

          const portrait=page.locator('#portrait-stage');
          await portrait.hover({position:{x:portrait?300:10,y:260}});
          await page.waitForTimeout(220);
          check('hover activates face',await portrait.evaluate(e=>e.classList.contains('is-alive')));
          check('one gravity node active',await page.locator('.planet.gravity-active').count()===1);

          await page.locator('#neural-lock').click();
          check('neural lock pressed',(await page.locator('#neural-lock').getAttribute('aria-pressed'))==='true');
          check('portrait locked',await portrait.evaluate(e=>e.classList.contains('is-locked')));
          await page.mouse.move(20,20);
          await page.waitForTimeout(150);
          check('locked node persists',await page.locator('.planet.gravity-active').count()===1);

          await page.locator('#work').scrollIntoViewIfNeeded();
          await page.waitForTimeout(350);
          check('projects scene activates',await page.evaluate(()=>document.body.dataset.scene==='projects'));

          await page.locator('#investigations').scrollIntoViewIfNeeded();
          await page.waitForTimeout(350);
          check('investigations atmosphere activates',await page.evaluate(()=>document.body.dataset.scene==='investigations'));

          const lab=page.locator('.archive-groups .lab-row').first();
          await lab.scrollIntoViewIfNeeded();
          await lab.hover({position:{x:120,y:30}});
          await page.waitForTimeout(100);
          check('gallery hover tracks cursor',await lab.evaluate(e=>getComputedStyle(e).getPropertyValue('--gallery-x').trim()!==''));

          await page.locator('#contact').scrollIntoViewIfNeeded();
          await page.waitForTimeout(350);
          check('contact orbit still intact',await page.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='absolute')));
          check('no horizontal overflow',await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          await page.screenshot({path:'lando-refinement-desktop.png',fullPage:false});

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          mobile.on('pageerror',e=>results.runtimeErrors.push('mobile:'+e.message));
          await mobile.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded'});
          await mobile.waitForTimeout(1450);
          check('mobile no horizontal overflow',await mobile.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2));
          check('mobile neural lock compact',await mobile.locator('#neural-lock').evaluate(e=>Math.round(e.getBoundingClientRect().width)<=48));
          await mobile.locator('#contact').scrollIntoViewIfNeeded();
          await mobile.waitForTimeout(200);
          check('mobile contact remains linear',await mobile.locator('.contact-side .pill').evaluateAll(nodes=>nodes.every(n=>getComputedStyle(n).position==='relative')));
          await mobile.screenshot({path:'lando-refinement-mobile.png',fullPage:false});

          check('no runtime errors',results.runtimeErrors.length===0,results.runtimeErrors.join('\n'));
          fs.writeFileSync('lando-refinement-results.json',JSON.stringify(results,null,2));
          await browser.close();
          if(results.failures.length||results.runtimeErrors.length) process.exit(1);
          NODE
          node smoke.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lando-refinement-evidence
          path: |
            lando-refinement-results.json
            lando-refinement-desktop.png
            lando-refinement-mobile.png
